services:
  - type: web
    name: bycodehub
    runtime: python:3.9
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bycodehub-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PGSSLMODE
        value: require

databases:
  - name: bycodehub-db
    databaseName: bycodehub
    user: bycodehub
    plan: free
    region: singapore
